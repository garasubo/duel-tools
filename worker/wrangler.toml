name = "duel-tools-share"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-01"

[build]
command = "cargo install -q worker-build && worker-build --release"

# 記録共有スナップショットの保存先。
# `wrangler kv namespace create SHARES` で作成した id を設定する。
[[kv_namespaces]]
binding = "SHARES"
id = "11d869a8dcc4495cb15b9e51c432a751"
preview_id = "2c6f74f270aa47c0ae2521f5568478a5"
