[package]
name = "duel-tools-share"
version = "0.1.0"
edition = "2021"
authors = ["garasubo"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WASM ターゲットでは js バックエンド、ネイティブ(cargo test)では OS RNG を使う
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
